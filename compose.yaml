services:
  app:
    build: .
    container_name: app-metodos-pago
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - app_data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: app-metodos-pago-tunnel
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?Define CLOUDFLARE_TUNNEL_TOKEN en .env}

volumes:
  app_data:
